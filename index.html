<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
<div class="wrapper">
  <div class="container">
    <img src="./assets/images/avatar-jessica.jpeg" alt="Profile picture" class="round-image">
  </div>
  <div class="name">Jessica Randall</div>
  <div class="location">London, United Kingdom</div>
  <div class="bio">"Front-end developer and avid reader."</div>

  <ul class="social-links">
    <li><a href="#" class="social-link1">GitHub</a></li>
    <li><a href="#" class="social-link2">Frontend Mentor</a></li>
    <li><a href="#" class="social-link3">LinkedIn</a></li>
    <li><a href="#" class="social-link4">Twitter</a></li>
    <li><a href="#" class="social-link5">Instagram</a></li>
  </ul>
</div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Emmanuel</a>.
  </footer>
</body>
</html>
